[project]
name = "IA7202-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastparquet>=2026.5.0",
    "ipykernel>=7.3.0",
    "ipython>=9.15.0",
    "jupyterlab>=4.6.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "missingno>=0.5.2",
    "mlflow>=3.14.0",
    "narwhals>=2.24.0",
    "nltk>=3.10.0",
    "numba>=0.61",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "protobuf>=6.33.6",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "tqdm>=4.70.0",
    "umap-learn>=0.5.12",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "FAST",  # fastapi rules
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "DTZ",   # flake8-dtz
    "PT",    # pytest-style
    "PTH",   # flake8-pathlib
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",
    "B018",   # notebooks jupyter/jupytext terminan celdas con expresiones desnudas para mostrar su valor
    "RUF003", # Strange characters
    "F811",   # Ignorar regla para que las pautas puedan redefinir funciones
    "F821",   # Ignorar nombres no definidos. Eliminar más adelante.
]
