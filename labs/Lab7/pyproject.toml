[project]
name = "lab7-tarea"
version = "0.1.0"
description = "Material del estudiante del Laboratorio 7"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.6.2",
    "plotly>=7.1.0",
    "polars>=1.44.0",
    "pyarrow>=20.0.0",
    "statsmodels>=0.15.0",
    "streamlit[charts]>=1.61.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 80
target-version = "py313"
# Los notebooks son material docente: no se reformatean como módulos Python.
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PT", "PTH"]
ignore = ["E501", "RUF003"]
