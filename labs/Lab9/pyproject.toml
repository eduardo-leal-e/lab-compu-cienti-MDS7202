[project]
name = "pasturecam"
version = "0.1.0"
description = "Proyecto del Laboratorio 9: biomasa de pradera desde fotos"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.6.2",
    "mlflow>=3.0.0",
    "pillow>=11.0.0",
    "plotly>=6.9.0",
    "polars>=1.44.0",
    "pyarrow>=20.0.0",
    "scikit-learn>=1.7.0",
    "timm>=1.0.30",
    "torch>=2.8.0",
    "torchvision>=0.22.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext==1.19.5",
    "nbformat>=5.10",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

# torch y torchvision se instalan desde el índice CPU de PyTorch en Linux y
# Windows: el de PyPI trae ruedas CUDA de ~2 GB que el laboratorio no usa. En
# macOS, PyPI ya publica la rueda sin CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite importar con `from src.pasturecam...`, igual que el notebook.
pythonpath = ["."]
markers = [
    "etapa1: pruebas de datos y baseline del plato medidor",
    "etapa2: pruebas de embeddings preentrenados",
    "etapa3: pruebas de pipelines y leakage",
    "etapa4: pruebas de métricas",
]

[tool.ruff]
line-length = 80
target-version = "py313"
# Los notebooks y los .md son material docente. Sin esta exclusión,
# ruff-format reescribe el .py pareado y rompe el par dentro del commit.
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PT", "PTH"]
ignore = ["E501", "RUF003"]
