table: silver.orders
purpose: Conservar órdenes con fechas interpretables para productos analíticos.
grain: Una fila por order_id.
primary_key: [order_id]
owner: Equipo de datos Pudubella
lineage: [bronze.orders]
classification: interno
required_columns: [order_id, customer_id, order_status, order_purchase_timestamp, order_approved_at, order_delivered_carrier_date, order_delivered_customer_date, order_estimated_delivery_date, delivery_timestamp_missing]
column_types:
  order_id: string
  customer_id: string
  order_status: string
  order_purchase_timestamp: datetime
  order_approved_at: datetime
  order_delivered_carrier_date: datetime
  order_delivered_customer_date: datetime
  order_estimated_delivery_date: datetime
allow_empty: false
constraints:
  order_id:
    nullable: false
    unique: true
  customer_id:
    nullable: false
  order_status:
    nullable: false
    allowed_values: [approved, canceled, created, delivered, invoiced, processing, shipped, unavailable]
  order_purchase_timestamp:
    nullable: false
  delivery_timestamp_missing:
    nullable: false
